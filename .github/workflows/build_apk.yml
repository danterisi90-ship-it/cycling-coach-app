name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git wget unzip zip \
          openjdk-17-jdk \
          python3 python3-pip python3-dev python3-venv \
          autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev lld ccache \
          build-essential libltdl-dev patch \
          gettext gettext-base autopoint \
          libtool-bin gperf
        python3 --version

    - name: Install Buildozer + Cython
      run: |
        python3 -m pip install --upgrade pip "cython==0.29.36" buildozer==1.5.0
        buildozer --version
        cython --version

    - name: Prepare build directory
      run: |
        mkdir -p build_src
        cp app/main.py          build_src/
        cp app/coach_engine.py  build_src/
        cp app/buildozer.spec   build_src/
        cp model.joblib         build_src/
        cp model_config.json    build_src/
        echo "Contents:"
        ls -lh build_src/
        echo "Requirements:"
        grep "^requirements" build_src/buildozer.spec

    - name: Use pre-installed Android SDK and NDK r27
      run: |
        # The runner has NDK r27d at /usr/local/lib/android/sdk/ndk/27.3.13750724
        # Using it avoids a ~1 GB download and provides newer clang/libc++
        # which fixes NumPy 2.x C++ compilation errors with NDK r25b
        NDK_PATH="/usr/local/lib/android/sdk/ndk/27.3.13750724"
        SDK_PATH="/usr/local/lib/android/sdk"
        sed -i "s|#android.ndk_path =|android.ndk_path = $NDK_PATH|" build_src/buildozer.spec
        sed -i "s|#android.sdk_path =|android.sdk_path = $SDK_PATH|"  build_src/buildozer.spec
        sed -i "s|android.ndk = 25b|android.ndk = 25b|" build_src/buildozer.spec
        # Accept SDK licenses
        mkdir -p "$SDK_PATH/licenses"
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_PATH/licenses/android-sdk-license"
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_PATH/licenses/android-sdk-preview-license"
        echo "Spec NDK/SDK config:"
        grep -E '^android\.(ndk|sdk)' build_src/buildozer.spec
        echo "NDK exists: $(ls $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang 2>/dev/null && echo YES || echo NO)"

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-v6-${{ hashFiles('app/buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-v6-
          buildozer-${{ runner.os }}-

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK
      working-directory: build_src
      run: |
        buildozer -v android debug 2>&1
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cycling-coach-apk
        path: build_src/bin/*.apk
        retention-days: 30

    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: buildozer-failure-logs
        path: build_src/.buildozer/
        retention-days: 7

    - name: Show result
      run: |
        ls -lh build_src/bin/*.apk 2>/dev/null && echo "SUCCESS" || echo "No APK found"
