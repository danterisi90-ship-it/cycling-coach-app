name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git wget unzip zip \
          openjdk-17-jdk \
          python3 python3-pip python3-dev python3-venv \
          autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev lld ccache \
          build-essential libltdl-dev patch
        python3 --version

    - name: Install Buildozer + Cython
      run: |
        python3 -m pip install --upgrade pip "cython==0.29.36" buildozer==1.5.0
        buildozer --version
        cython --version

    - name: Prepare build directory
      run: |
        mkdir -p build_src
        cp app/main.py          build_src/
        cp app/coach_engine.py  build_src/
        cp app/buildozer.spec   build_src/
        cp model.joblib         build_src/
        cp model_config.json    build_src/
        echo "Contents:"
        ls -lh build_src/
        echo "Requirements:"
        grep "^requirements" build_src/buildozer.spec

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-v6-${{ hashFiles('app/buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-v6-
          buildozer-${{ runner.os }}-

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK
      working-directory: build_src
      run: |
        buildozer -v android debug 2>&1
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cycling-coach-apk
        path: build_src/bin/*.apk
        retention-days: 30

    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: buildozer-failure-logs
        path: build_src/.buildozer/
        retention-days: 7

    - name: Show result
      run: |
        ls -lh build_src/bin/*.apk 2>/dev/null && echo "SUCCESS" || echo "No APK found"
