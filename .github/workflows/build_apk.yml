name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Use ubuntu-22.04 which ships Python 3.10 by default (avoids 3.14 conflict)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-v2-${{ hashFiles('app/buildozer.spec') }}
        restore-keys: buildozer-${{ runner.os }}-v2-

    - name: Install system dependencies + Python 3.11
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git wget unzip zip \
          openjdk-17-jdk \
          python3.11 python3.11-dev python3.11-venv python3-pip \
          autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev lld ccache \
          build-essential libltdl-dev patch

    - name: Force Python 3.11 as system default
      run: |
        # Make python3 and python point to 3.11 everywhere
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
        sudo update-alternatives --set python3 /usr/bin/python3.11
        sudo ln -sf /usr/bin/python3.11 /usr/local/bin/python3
        sudo ln -sf /usr/bin/python3.11 /usr/local/bin/python
        python3 --version
        python --version

    - name: Install Buildozer
      run: |
        python3.11 -m pip install --upgrade pip
        python3.11 -m pip install buildozer==1.5.0 "cython==0.29.36"

    - name: Prepare build directory
      run: |
        mkdir -p build_src
        cp app/main.py          build_src/
        cp app/coach_engine.py  build_src/
        cp app/buildozer.spec   build_src/
        cp model.joblib         build_src/
        cp model_config.json    build_src/
        echo "Build directory contents:"
        ls -lh build_src/

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK with Buildozer
      working-directory: build_src
      run: |
        # Ensure buildozer uses 3.11 for both host and target
        export PYTHON=/usr/bin/python3.11
        ~/.local/bin/buildozer -v android debug 2>&1
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        PATH: /home/runner/.local/bin:/usr/bin:/usr/local/bin:/usr/sbin:/usr/local/sbin:/sbin:/bin

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cycling-coach-apk
        path: build_src/bin/*.apk
        retention-days: 30

    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: buildozer-logs
        path: build_src/.buildozer/android/
        retention-days: 7

    - name: Show APK info
      if: success()
      working-directory: build_src
      run: |
        echo "=== Build Complete ==="
        ls -lh bin/*.apk || echo "No APK found"
