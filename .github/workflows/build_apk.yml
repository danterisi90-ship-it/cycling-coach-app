name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git wget unzip zip \
          openjdk-17-jdk \
          python3 python3-pip python3-dev python3-venv \
          autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev lld ccache \
          build-essential libltdl-dev patch

    - name: Detect system Python version
      run: |
        PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
        echo "System Python version: $PYVER"
        echo "SYSTEM_PYVER=$PYVER" >> $GITHUB_ENV
        python3 --version

    - name: Install Buildozer
      run: |
        # Install directly into system Python — buildozer uses --user pip internally
        # which is blocked inside a venv, so we cannot use a venv here
        python3 -m pip install --upgrade pip "cython==0.29.36" buildozer==1.5.0
        buildozer --version
        cython --version

    - name: Prepare build directory
      run: |
        mkdir -p build_src
        cp app/main.py          build_src/
        cp app/coach_engine.py  build_src/
        cp app/buildozer.spec   build_src/
        cp model.joblib         build_src/
        cp model_config.json    build_src/
        echo "Build directory:"
        ls -lh build_src/

    - name: Patch buildozer.spec to match system Python
      run: |
        # Replace python3==X.Y with the detected system version
        # Ensures python3 recipe == hostpython3 == venv Python — all match
        sed -i "s/python3==[0-9][0-9]*\.[0-9][0-9]*/python3==${{ env.SYSTEM_PYVER }}/g" \
          build_src/buildozer.spec
        echo "Requirements after patch:"
        grep "^requirements" build_src/buildozer.spec

    - name: Cache Buildozer downloads
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-py${{ env.SYSTEM_PYVER }}-${{ hashFiles('app/buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-py${{ env.SYSTEM_PYVER }}-
          buildozer-${{ runner.os }}-

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK
      working-directory: build_src
      run: |
        buildozer -v android debug 2>&1
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cycling-coach-apk
        path: build_src/bin/*.apk
        retention-days: 30

    - name: Upload buildozer logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: buildozer-failure-logs
        path: |
          build_src/.buildozer/android/platform/build-*/dists/cyclingcoach/build.log
          build_src/.buildozer/android/platform/build-*/build.log
        retention-days: 7

    - name: Show result
      run: |
        if ls build_src/bin/*.apk 1>/dev/null 2>&1; then
          echo "=== BUILD SUCCEEDED ==="
          ls -lh build_src/bin/*.apk
        else
          echo "=== NO APK FOUND ==="
          ls build_src/bin/ 2>/dev/null || echo "bin/ directory does not exist"
        fi
